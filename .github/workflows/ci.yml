name: Verificação

# Roda em toda branch e em todo pull request. Enquanto isto não passar, nada vai para produção.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Tipos
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Auditoria dos prompts
        run: npm run test:prompts

      - name: Build
        run: npm run build
